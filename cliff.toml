# git-cliff: CHANGELOG.md sections from Conventional Commits (CI rejects any other commit message).
# scripts/prepare-release.ps1 prepends one section per release; release.yml publishes that section as the notes.

[changelog]
header = """
# Changelog

Every release of Clip Recorder, newest first. Sections are generated from the commit history by git-cliff.

"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## [Unreleased]{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Merge commits and the Python app's history before the convention are left out.
filter_unconventional = true
filter_commits = true
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^docs", group = "<!-- 3 -->Documentation" },
    { message = "^test", group = "<!-- 4 -->Tests" },
    { message = "^(ci|build)", group = "<!-- 5 -->CI and build" },
    { message = "^refactor", group = "<!-- 6 -->Refactoring" },
    { message = "^(style|chore)", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
