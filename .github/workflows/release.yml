name: Release

# A v* tag: the same tests as CI, the MSI built once, its provenance attested (SLSA), then
# published as a pre-release only after the owner approves the `release` environment. The
# artifact that was tested and attested is the one published; nothing is rebuilt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  # Pinned tools, installed from crates.io (checksums verified by cargo).
  CARGO_CYCLONEDX_VERSION: "0.5.10"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # provenance signing (OIDC), this job only
      attestations: write
    outputs:
      msi: ${{ steps.msi.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --lib --bins --examples --test source
      # WiX and its extensions, each checked against nuget.org's published SHA-512 before use.
      - run: ./scripts/install-wix.ps1
      - run: ./build-msi.ps1
      # The MSI about to be published goes through its whole life on this disposable runner first.
      - run: |
          ./tests/msi/upgrade-pair.ps1 -Out $env:RUNNER_TEMP
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tests/msi/lifecycle.ps1 -Old "$env:RUNNER_TEMP\old.msi" -New "$env:RUNNER_TEMP\new.msi" -Out "$env:RUNNER_TEMP\lifecycle"
      # The SBOM of the Windows build (FFmpeg, not a Cargo dependency, is named in the release notes).
      - run: |
          cargo install cargo-cyclonedx --version $env:CARGO_CYCLONEDX_VERSION --locked
          cargo cyclonedx --format json --spec-version 1.5 --target x86_64-pc-windows-msvc --override-filename sbom
          Move-Item sbom.json target\sbom.cdx.json
      - id: msi
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$version" -and $tag -ne "v$($version -replace '\.0$', '')") {
            throw "Tag $tag does not match Cargo.toml version $version"
          }
          $name = "clip-recorder-$version-x64.msi"
          if (-not (Test-Path "target\$name")) { throw "No target\$name" }
          "name=$name" >> $env:GITHUB_OUTPUT
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/${{ steps.msi.outputs.name }}
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: target/${{ steps.msi.outputs.name }}
          sbom-path: target/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi
          path: |
            target/${{ steps.msi.outputs.name }}
            target/sbom.cdx.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Approved by the owner in GitHub before it runs (Settings > Environments > release).
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MSI: ${{ needs.build.outputs.msi }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$MSI" sbom.cdx.json --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --prerelease --verify-tag --generate-notes \
            --notes "[Code signing policy](https://github.com/$GITHUB_REPOSITORY/blob/master/CODE_SIGNING_POLICY.md)"
