name: Release

# A v* tag: the same tests as CI, the MSI built once, its provenance attested (SLSA), then
# published as a pre-release only after the owner approves the `release` environment. The
# artifact that was tested and attested is the one published; nothing is rebuilt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # provenance signing (OIDC), this job only
      attestations: write
    outputs:
      msi: ${{ steps.msi.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --lib --bins --examples --test source
      # WiX 7 needs its Open Source Maintenance Fee EULA accepted once per machine.
      - run: |
          dotnet tool install --global wix --version 7.0.1
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.UI.wixext/7.0.1 WixToolset.Util.wixext/7.0.1
      - run: ./build-msi.ps1
      - id: msi
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$version" -and $tag -ne "v$($version -replace '\.0$', '')") {
            throw "Tag $tag does not match Cargo.toml version $version"
          }
          $name = "clip-recorder-$version-x64.msi"
          if (-not (Test-Path "target\$name")) { throw "No target\$name" }
          "name=$name" >> $env:GITHUB_OUTPUT
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/${{ steps.msi.outputs.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi
          path: target/${{ steps.msi.outputs.name }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Approved by the owner in GitHub before it runs (Settings > Environments > release).
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MSI: ${{ needs.build.outputs.msi }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$MSI" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --prerelease --verify-tag --generate-notes \
            --notes "[Code signing policy](https://github.com/$GITHUB_REPOSITORY/blob/master/CODE_SIGNING_POLICY.md)"
